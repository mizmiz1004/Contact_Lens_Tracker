<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LensLog</title>
<meta name="theme-color" content="#f2f2f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LensLog">
<style>
:root {
  --bg:       #f0f2f8;
  --surface:  #ffffff;
  --surface2: #f6f7fb;
  --border:   #e8eaf2;
  --border2:  #d4d8ec;
  --text:     #1a1d2e;
  --muted:    #9096b4;
  --muted2:   #b8bcce;

  /* アクセント: 色相環のライトカラー帯 — コーンフラワーブルー */
  --accent:   #4a9eff;
  --accent-l: #eaf4ff;
  --accent-m: #b8d9ff;

  /* セカンダリ: ラベンダー〜ライラック */
  --accent2:  #ff6b9d;
  --accent2-l:#fff0f5;

  --danger:   #ff5252;
  --danger-l: #fff0f0;
  --warn:     #ffaa2e;
  --warn-l:   #fff8ee;
  --safe:     #2ecc8f;
  --safe-l:   #e8faf3;

  --nav-h:    54px;
  --sab:      env(safe-area-inset-bottom, 0px);
  --radius:   20px;
  --radius-s: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
svg { display: block; flex-shrink: 0; overflow: visible; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex; flex-direction: column;
}

/* ── PAGES ── */
#app { flex: 1; overflow: hidden; position: relative; }
.page {
  position: absolute; inset: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0 16px calc(var(--nav-h) + var(--sab) + 12px);
  display: none;
}
.page.active { display: block; }

/* ── NAV ── */
nav {
  height: calc(var(--nav-h) + var(--sab));
  padding-bottom: var(--sab);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; flex-shrink: 0;
}
.nav-btn {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px;
  background: none; border: none;
  color: var(--muted2);
  font-size: 0.56rem; font-family: inherit; font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer; transition: color 0.15s;
  padding: 6px 0 2px;
}
.nav-btn span { line-height: 1; }
.nav-btn.active { color: var(--accent); }
.nav-ic-wrap {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
}
.nav-ic-wrap svg { display: block; width: 22px; height: 22px; }

/* ── PAGE HEADER ── */
.page-header {
  padding: 20px 0 8px;
  display: flex; align-items: flex-end; justify-content: space-between;
}
.page-header-title {
  font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: var(--text);
}
.page-header-sub {
  font-size: 0.7rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(100,110,180,0.06), 0 4px 16px rgba(100,110,180,0.08);
}

/* ── STATUS CHIP ── */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 20px;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
  margin-bottom: 16px;
}
.chip.ok      { background: var(--accent-l); color: var(--accent); }
.chip.warning { background: var(--warn-l);   color: var(--warn); }
.chip.expired { background: var(--danger-l); color: var(--danger); }
.chip.unset   { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.45;transform:scale(0.6)} }

/* ── HERO ── */
.hero-row { display: flex; align-items: center; gap: 20px; }

.ring-wrap { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
.ring-svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--border); stroke-width: 7; }
.ring-prog {
  fill: none; stroke-width: 7; stroke-linecap: round;
  transition: stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1), stroke .4s;
}
.ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-num  { font-size: 2rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
.ring-unit { font-size: 0.52rem; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; }

.hero-info { flex: 1; }
.elapsed-num { font-size: 3.6rem; font-weight: 800; line-height: 1; letter-spacing: -0.06em; color: var(--accent); }
.elapsed-sub { font-size: 0.62rem; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 5px; }
.open-date   { font-size: 0.7rem; color: var(--muted); margin-top: 10px; font-weight: 500; }

/* ── DOT STRIP ── */
.dot-strip { display: flex; gap: 5px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
.dp { flex: 1; aspect-ratio: 1; border-radius: 50%; background: var(--border); transition: all .25s; }
.dp.on      { background: var(--accent); }
.dp.cur     { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-m); }
.dp.warn-dp { background: #e8a020; }
.dp.danger-dp { background: #e05a3a; }

/* ── ALERT ── */
.alert {
  display: none; padding: 12px 14px; border-radius: var(--radius-s);
  font-size: 0.74rem; font-weight: 600; margin-bottom: 12px;
  border: 1px solid; gap: 9px; align-items: center;
}
.alert.danger { background: var(--danger-l); border-color: rgba(245,108,108,0.2); color: var(--danger); display: flex; }
.alert.warn   { background: var(--warn-l);   border-color: rgba(245,166,35,0.2);  color: var(--warn);   display: flex; }
.alert.safe   { background: var(--safe-l);   border-color: rgba(78,203,141,0.2);  color: var(--safe);   display: flex; }

/* ── BUTTON ── */
.btn-main {
  width: 100%; padding: 17px;
  background: #3daa7a;
  color: #fff; border: none; border-radius: var(--radius-s);
  font-family: inherit; font-size: 0.82rem; font-weight: 800;
  letter-spacing: 0.06em; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(61,170,122,0.28);
  transition: opacity .15s, transform .15s;
}
.btn-main:active { opacity: 0.85; transform: scale(0.99); }

/* ── CALENDAR ── */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-title { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; }
.cal-arrow {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  width: 34px; height: 34px; color: var(--muted); cursor: pointer; font-size: 1.3rem; line-height: 1;
  display: flex; align-items: center; justify-content: center; transition: all .12s;
}
.cal-arrow:hover { border-color: var(--accent); color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 0.6rem; font-weight: 700; color: var(--muted2); padding: 5px 0; letter-spacing: 0.06em; }
.cal-day {
  aspect-ratio: 1; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.74rem; font-weight: 500; color: var(--muted2); position: relative;
}
.cal-day.today   { outline: 2px solid #e8a020; outline-offset: -2px; color: #e8a020; font-weight: 800; }
.cal-day.in-pair { background: #fdf4e3; color: #c47a10; font-weight: 700; }
.cal-day.future  { opacity: 0.3; }
.cal-day.open-day::after {
  content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: #3daa7a;
}
.cal-legend { display: flex; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.leg { display: flex; align-items: center; gap: 6px; font-size: 0.63rem; font-weight: 600; color: var(--muted); }
.leg-sw { width: 10px; height: 10px; border-radius: 3px; }

/* ── STATS ── */
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 12px; }
.stat-box {
  background: var(--surface); border-radius: var(--radius-s);
  padding: 16px 8px; text-align: center;
  box-shadow: 0 1px 3px rgba(100,110,180,0.06), 0 2px 10px rgba(100,110,180,0.07);
}
.stat-n { font-size: 2rem; font-weight: 800; color: var(--accent); letter-spacing: -0.04em; line-height: 1; margin-bottom: 5px; }
.stat-l { font-size: 0.56rem; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.5; }
.rate-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.rate-title { font-size: 0.62rem; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.rate-val   { font-size: 1rem; font-weight: 800; color: var(--accent); }
.rate-bg    { height: 6px; background: var(--accent-l); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.rate-fill  { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent3)); border-radius: 3px; transition: width 1.1s cubic-bezier(.16,1,.3,1); width: 0; }
.tip-box {
  background: #e5f7ef; border-radius: 12px;
  padding: 13px 14px; font-size: 0.74rem; line-height: 1.6; color: var(--muted);
  display: flex; gap: 10px; align-items: flex-start;
}
.tip-box > svg { width: 15px !important; height: 15px !important; min-width: 15px; min-height: 15px; max-width: 15px; max-height: 15px; }
.tip-icon { color: #3daa7a; font-size: 0.8rem; flex-shrink: 0; margin-top: 2px; }

/* ── HISTORY ── */
.h-item {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 14px; background: var(--surface);
  border-radius: var(--radius-s); font-size: 0.72rem; margin-bottom: 8px;
  box-shadow: 0 1px 3px rgba(100,110,180,0.06), 0 2px 8px rgba(100,110,180,0.06);
}
.h-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--accent); }
.h-dot.over { background: var(--danger); }
.h-date { flex: 1; font-size: 0.68rem; color: var(--muted); font-weight: 500; }
.h-tag {
  font-size: 0.6rem; font-weight: 700; padding: 3px 9px;
  border-radius: 20px; letter-spacing: 0.04em;
}
.h-tag.active { background: #fdeee9; color: #e05a3a; }
.h-tag.done   { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.h-tag.over   { background: var(--danger-l); color: var(--danger); }
.h-tag.first  { background: #e5f7ef; color: #3daa7a; }

/* ── SETTINGS ── */
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 0; border-bottom: 1px solid var(--border); gap: 12px;
}
.setting-row:last-of-type { border-bottom: none; }
.setting-name { font-size: 0.82rem; font-weight: 700; margin-bottom: 3px; }
.setting-desc { font-size: 0.63rem; color: var(--muted); font-weight: 500; }
.num-input {
  background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px;
  padding: 8px 10px; font-family: inherit; font-size: 0.9rem; font-weight: 800;
  width: 60px; text-align: center; color: #c47a10; flex-shrink: 0;
}
.num-input:focus { outline: none; border-color: #e8a020; background: #fdf4e3; }
.btn-reset {
  margin-top: 16px; background: transparent;
  border: 1px solid rgba(245,108,108,0.3); border-radius: 10px;
  color: var(--danger); padding: 10px 16px; font-family: inherit;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all .15s;
}
.btn-reset:hover { background: var(--danger-l); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + var(--sab) + 14px); left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--text); color: #fff;
  padding: 11px 22px; border-radius: 30px;
  font-size: 0.74rem; font-weight: 700; letter-spacing: 0.02em;
  opacity: 0; transition: all .35s cubic-bezier(.16,1,.3,1); z-index: 100;
  white-space: nowrap; pointer-events: none;
  box-shadow: 0 6px 24px rgba(26,29,46,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SECTION LABEL ── */
.sec-label {
  font-size: 0.6rem; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
}
.page-title {
  font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); padding: 20px 0 12px;
}
</style>
</head>
<body>


<div id="app">

  <!-- HOME -->
  <div class="page active" id="pg-home">
    <div class="page-header" style="padding:22px 0 10px; display:flex; align-items:flex-end; justify-content:space-between;">
      <div>
        <div style="font-size:0.62rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">Contact Lens</div>
        <div style="font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);">LensLog</div>
      </div>
      <div id="todayLabel" style="font-size:0.68rem;font-weight:600;color:var(--muted);text-align:right;line-height:1.6;"></div>
    </div>

    <div class="alert" id="alertBanner"></div>

    <div class="card">
      <div class="sec-label">今日のステータス</div>
      <div class="chip unset" id="statusChip">
        <div class="chip-dot"></div>
        <span id="statusText">ペア未開始</span>
      </div>

      <div class="hero-row">
        <div class="ring-wrap">
          <svg class="ring-svg" width="110" height="110" viewBox="0 0 110 110">
            <circle class="ring-track" cx="55" cy="55" r="46"/>
            <circle class="ring-prog" id="ringProg" cx="55" cy="55" r="46"
              stroke-dasharray="289.0" stroke-dashoffset="289.0" stroke="var(--accent)"/>
          </svg>
          <div class="ring-inner">
            <div class="ring-num" id="ringNum" style="color:var(--accent)">—</div>
            <div class="ring-unit">残り日</div>
          </div>
        </div>
        <div class="hero-info">
          <div class="elapsed-num" id="elapsedNum">0</div>
          <div class="elapsed-sub">経過日数 / <span id="maxLabel">14</span>日</div>
          <div class="open-date" id="openDateLbl"></div>
        </div>
      </div>

      <div class="dot-strip" id="progDots"></div>
    </div>

    <button class="btn-main" onclick="startNewPair()">
      新しいペアを開封した
    </button>
  </div>

  <!-- CALENDAR -->
  <div class="page" id="pg-cal">
    <div class="page-title">カレンダー</div>
    <div class="card">
      <div class="cal-nav">
        <button class="cal-arrow" onclick="changeMonth(-1)">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-arrow" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <div class="leg"><div class="leg-sw" style="background:#fdf4e3;border:1.5px solid #f5d99a"></div>使用期間</div>
        <div class="leg"><div class="leg-sw" style="background:#3daa7a;border-radius:50%"></div>開封日</div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="page" id="pg-stats">
    <div class="page-title">統計</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-n" id="stMonth" style="color:#3daa7a">0</div><div class="stat-l">今月<br>使用日</div></div>
      <div class="stat-box"><div class="stat-n" id="stElapsed" style="color:#e8a020">0</div><div class="stat-l">現在<br>経過日</div></div>
      <div class="stat-box"><div class="stat-n" id="stPairs" style="color:#e05a3a">0</div><div class="stat-l">累計<br>ペア</div></div>
    </div>
    <div class="card">
      <div class="rate-row">
        <div class="rate-title">現在ペアの使用進捗</div>
        <div class="rate-val" id="rateVal">—%</div>
      </div>
      <div class="rate-bg"><div class="rate-fill" id="rateFill"></div></div>
      <div class="tip-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3daa7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px;min-width:15px"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14z"/></svg>
        <div id="tipText"></div>
      </div>
    </div>
  </div>

  <!-- LOG -->
  <div class="page" id="pg-log">
    <div class="page-title">履歴</div>
    <div id="histList"></div>
  </div>

  <!-- SETTINGS -->
  <div class="page" id="pg-set">
    <div class="page-title">設定</div>
    <div class="card">
      <div class="setting-row">
        <div><div class="setting-name">使用期間の上限</div><div class="setting-desc">通常 14日（2WEEK）</div></div>
        <input class="num-input" type="number" id="maxDays" value="14" min="1" max="30" onchange="saveSettings()">
      </div>
      <div class="setting-row">
        <div><div class="setting-name">警告タイミング</div><div class="setting-desc">残り○日以下で警告を表示</div></div>
        <input class="num-input" type="number" id="warnDays" value="2" min="1" max="7" onchange="saveSettings()">
      </div>
      <button class="btn-reset" onclick="resetAll()">全データをリセット</button>
    </div>
  </div>

</div>

<!-- NAV -->
<nav>
  <button class="nav-btn active" id="nav-home" onclick="goPage('home')">
    <div class="nav-ic-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <span>ホーム</span>
  </button>
  <button class="nav-btn" id="nav-cal" onclick="goPage('cal')">
    <div class="nav-ic-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
    <span>カレンダー</span>
  </button>
  <button class="nav-btn" id="nav-stats" onclick="goPage('stats')">
    <div class="nav-ic-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </div>
    <span>統計</span>
  </button>
  <button class="nav-btn" id="nav-log" onclick="goPage('log')">
    <div class="nav-ic-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
    </div>
    <span>履歴</span>
  </button>
  <button class="nav-btn" id="nav-set" onclick="goPage('set')">
    <div class="nav-ic-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
    <span>設定</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const KEY = 'lenslog_v5';
let D = { pairs:[], settings:{ maxDays:14, warnDays:2 } };

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) D = { ...D, ...JSON.parse(s) };
    D.settings = { maxDays:14, warnDays:2, ...D.settings };
    if (!D.pairs) D.pairs = [];
  } catch(e) {}
}
function save() { localStorage.setItem(KEY, JSON.stringify(D)); }

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
function p2(n) { return String(n).padStart(2,'0'); }
function parseDate(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function toISO(d) { return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function fmtShort(iso) {
  const d = parseDate(iso), dw = ['日','月','火','水','木','金','土'];
  return `開封日 ${d.getMonth()+1}/${d.getDate()}(${dw[d.getDay()]})`;
}
function fmtFull(iso) {
  const d = parseDate(iso), dw = ['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}(${dw[d.getDay()]})`;
}

function curPair() { return D.pairs.length ? D.pairs[D.pairs.length-1] : null; }

function elapsedDays() {
  const p = curPair(); if (!p) return 0;
  return Math.floor((parseDate(today()) - parseDate(p.start)) / 86400000) + 1;
}

function pairOf(iso) {
  for (let i = D.pairs.length-1; i >= 0; i--) {
    if (D.pairs[i].start <= iso) return D.pairs[i];
  }
  return null;
}

function isInPair(iso) {
  if (iso > today()) return false;
  const p = pairOf(iso); if (!p) return false;
  const idx = D.pairs.indexOf(p);
  if (idx < D.pairs.length-1 && iso >= D.pairs[idx+1].start) return false;
  return true;
}

function startNewPair() {
  if (!confirm('今日を開封日として新しいペアを開始しますか？')) return;
  D.pairs.push({ start: today() });
  save(); render(); showToast('新しいペアを開始しました');
}
function saveSettings() {
  D.settings.maxDays  = parseInt(document.getElementById('maxDays').value)  || 14;
  D.settings.warnDays = parseInt(document.getElementById('warnDays').value) || 2;
  save(); render();
}
function resetAll() {
  if (!confirm('全データを削除しますか？')) return;
  localStorage.removeItem(KEY);
  D = { pairs:[], settings:{ maxDays:14, warnDays:2 } };
  render(); showToast('リセットしました');
}

function render() { renderHome(); renderCalendar(); renderStats(); renderHistory(); applySettings(); }

function renderHome() {
  // 今日の日付表示
  const now = new Date();
  const dw = ['日','月','火','水','木','金','土'];
  document.getElementById('todayLabel').innerHTML =
    `${now.getFullYear()}.${p2(now.getMonth()+1)}.${p2(now.getDate())}<br>${dw[now.getDay()]}曜日`;

  const p = curPair();
  const elapsed = elapsedDays();
  const max = D.settings.maxDays;
  const rem = p ? Math.max(0, max - elapsed + 1) : 0;
  const over = p && elapsed > max;
  const nearWarn = p && !over && elapsed >= max - D.settings.warnDays + 1;

  // chip
  const chip = document.getElementById('statusChip');
  if (!p) {
    chip.className = 'chip unset';
    document.getElementById('statusText').textContent = 'ペア未開始';
  } else if (over) {
    chip.className = 'chip expired';
    document.getElementById('statusText').textContent = '使用期限切れ';
  } else if (nearWarn) {
    chip.className = 'chip warning';
    document.getElementById('statusText').textContent = `残り${rem}日`;
  } else {
    chip.className = 'chip ok';
    document.getElementById('statusText').textContent = `${elapsed}日目`;
  }

  // ring
  const C = 289.0;
  const pct = p ? Math.min(elapsed / max, 1) : 0;
  const col = !p ? 'var(--accent)' : over ? 'var(--danger)' : nearWarn ? 'var(--warn)' : 'var(--accent)';
  document.getElementById('elapsedNum').textContent = p ? elapsed : 0;
  document.getElementById('elapsedNum').style.color = col;
  document.getElementById('ringNum').textContent = p ? (over ? '0' : rem) : '—';
  document.getElementById('ringNum').style.color = col;
  document.getElementById('maxLabel').textContent = max;
  document.getElementById('openDateLbl').textContent = p ? fmtShort(p.start) : '';
  const ring = document.getElementById('ringProg');
  ring.style.strokeDashoffset = C * (1 - pct);
  ring.style.stroke = col;

  // dots
  const dots = document.getElementById('progDots');
  dots.innerHTML = '';
  for (let i = 0; i < max; i++) {
    const el = document.createElement('div'); el.className = 'dp';
    if (p && i < elapsed) {
      const isToday = i === elapsed - 1;
      const isWarn  = i >= max - D.settings.warnDays;
      if (over) el.classList.add('danger-dp');
      else if (isWarn) el.classList.add('warn-dp');
      else el.classList.add(isToday ? 'cur' : 'on');
    }
    dots.appendChild(el);
  }

  // alert
  const al = document.getElementById('alertBanner');
  const iA = `<span style="font-size:0.9rem;flex-shrink:0">⚠</span>`;
  const iC = `<span style="font-size:0.9rem;flex-shrink:0">✓</span>`;
  if (!p) {
    al.className = 'alert'; al.style.display = 'none';
  } else if (over) {
    al.className = 'alert danger';
    al.innerHTML = `${iA}<span>使用期限を超過しています。今すぐ交換してください。</span>`;
  } else if (nearWarn) {
    al.className = 'alert warn';
    al.innerHTML = `${iA}<span>残り <strong>${rem}日</strong> で交換時期です。準備しておきましょう。</span>`;
  } else {
    al.className = 'alert safe';
    al.innerHTML = `${iC}<span>良好。残り <strong>${rem}日</strong> 使用できます。</span>`;
  }
}

// calendar
let calY, calM;
function initCal() { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); }
function changeMonth(dir) {
  calM += dir;
  if (calM < 0)  { calM = 11; calY--; }
  if (calM > 11) { calM = 0;  calY++; }
  renderCalendar();
}
function renderCalendar() {
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent = `${calY}年 ${months[calM]}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['日','月','火','水','木','金','土'].forEach(d => {
    const e = document.createElement('div'); e.className = 'cal-dow'; e.textContent = d; grid.appendChild(e);
  });
  const first = new Date(calY, calM, 1).getDay();
  const dim   = new Date(calY, calM+1, 0).getDate();
  const ti    = today();
  const pStarts = new Set(D.pairs.map(p => p.start));
  for (let i = 0; i < first; i++) {
    const e = document.createElement('div'); e.className = 'cal-day empty'; grid.appendChild(e);
  }
  for (let d = 1; d <= dim; d++) {
    const iso = `${calY}-${p2(calM+1)}-${p2(d)}`;
    const e   = document.createElement('div'); e.className = 'cal-day'; e.textContent = d;
    if (iso === ti)         e.classList.add('today');
    if (iso > ti)           e.classList.add('future');
    else if (isInPair(iso)) e.classList.add('in-pair');
    if (pStarts.has(iso))   e.classList.add('open-day');
    grid.appendChild(e);
  }
}

function renderStats() {
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth()+1;
  let mw = 0;
  for (let d = 1; d <= now.getDate(); d++) { if (isInPair(`${y}-${p2(mo)}-${p2(d)}`)) mw++; }
  document.getElementById('stMonth').textContent   = mw;
  document.getElementById('stPairs').textContent   = D.pairs.length;
  const elapsed = elapsedDays();
  document.getElementById('stElapsed').textContent = elapsed || 0;
  const max  = D.settings.maxDays;
  const rate = max > 0 && curPair() ? Math.round(Math.min(elapsed/max, 1) * 100) : 0;
  document.getElementById('rateFill').style.width = rate + '%';
  document.getElementById('rateVal').textContent  = curPair() ? rate + '%' : '—%';
  const tips = [
    '2Weekコンタクトは開封から14日が交換目安です。',
    '就寝前は必ずレンズを外しましょう。',
    '使用期限内でも違和感があればすぐに外して。',
    '定期的に眼科での検診をおすすめします。',
    'ケア用品の有効期限も定期的に確認しましょう。',
  ];
  document.getElementById('tipText').textContent = tips[now.getDate() % tips.length];
}

function renderHistory() {
  const list = document.getElementById('histList');
  if (!D.pairs.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted2);font-size:0.75rem;padding:32px;">記録がありません</div>';
    return;
  }
  list.innerHTML = '';
  [...D.pairs].reverse().forEach((p, ri) => {
    const idx      = D.pairs.length - 1 - ri;
    const isActive = idx === D.pairs.length - 1;
    const nextP    = D.pairs[idx+1];
    const endIso   = nextP ? (() => { const d = parseDate(nextP.start); d.setDate(d.getDate()-1); return toISO(d); })() : today();
    const days     = Math.floor((parseDate(endIso) - parseDate(p.start)) / 86400000) + 1;
    const over     = !isActive && days > D.settings.maxDays;
    const el = document.createElement('div'); el.className = 'h-item';
    const badge = isActive
      ? `<span class="h-tag active">使用中</span>`
      : over
        ? `<span class="h-tag over">${days}日使用</span>`
        : `<span class="h-tag done">${days}日使用</span>`;
    const first = idx === 0 ? `<span class="h-tag first">初回</span>` : '';
    el.innerHTML = `<div class="h-dot ${over ? 'over' : ''}"></div><span class="h-date">${fmtFull(p.start)}</span>${first}${badge}`;
    list.appendChild(el);
  });
}

function applySettings() {
  document.getElementById('maxDays').value  = D.settings.maxDays;
  document.getElementById('warnDays').value = D.settings.warnDays;
}

function goPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pg-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'stats')  renderStats();
  if (name === 'log')    renderHistory();
  if (name === 'cal')    renderCalendar();
}

let _tt;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 2200);
}

// PWA
(function() {
  // Canvasでアイコン生成（512x512）
  function makeIcon(size) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const cx = c.getContext('2d');
    const r = size * 0.22;
    // 背景
    cx.fillStyle = '#f7f7f5';
    cx.beginPath(); cx.roundRect(0,0,size,size,r); cx.fill();
    // グラデーション円
    const grad = cx.createLinearGradient(size*0.2,size*0.2,size*0.8,size*0.8);
    grad.addColorStop(0,'#e8a020'); grad.addColorStop(1,'#e05a3a');
    cx.strokeStyle = grad; cx.lineWidth = size * 0.055;
    // 目のアイコン（楕円＋円）
    cx.beginPath(); cx.ellipse(size/2,size/2,size*0.28,size*0.19,0,0,Math.PI*2); cx.stroke();
    cx.beginPath(); cx.arc(size/2,size/2,size*0.1,0,Math.PI*2); cx.stroke();
    cx.fillStyle = '#e8a020'; cx.beginPath(); cx.arc(size/2,size/2,size*0.04,0,Math.PI*2); cx.fill();
    return c;
  }

  // apple-touch-icon (180px)
  const icon180 = makeIcon(180);
  const appleLink = document.createElement('link');
  appleLink.rel = 'apple-touch-icon'; appleLink.href = icon180.toDataURL('image/png');
  document.head.appendChild(appleLink);

  // favicon (32px)
  const icon32 = makeIcon(32);
  const faviconLink = document.createElement('link');
  faviconLink.rel = 'icon'; faviconLink.type = 'image/png'; faviconLink.href = icon32.toDataURL('image/png');
  document.head.appendChild(faviconLink);

  // manifest (512px as data URL)
  const icon512 = makeIcon(512);
  const iconDataUrl = icon512.toDataURL('image/png');
  const m = { name:"LensLog", short_name:"LensLog", display:"standalone",
    background_color:"#f2f2f0", theme_color:"#f2f2f0", start_url:".",
    icons:[{ src: iconDataUrl, sizes:"512x512", type:"image/png", purpose:"any maskable" }] };
  const lk = document.createElement('link'); lk.rel='manifest';
  lk.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type:'application/manifest+json' }));
  document.head.appendChild(lk);

  if ('serviceWorker' in navigator) {
    const sw = `const C='ll-v4';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll([self.location.href])));self.skipWaiting();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{});
  }
})();

load(); initCal(); render();
</script>
